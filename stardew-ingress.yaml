apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stardew-ingress
  # Anotasi rewrite-target DIHAPUS agar routing tidak kacau
spec:
  ingressClassName: nginx # Wajib ditambahkan untuk AKS
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80