<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley Inventory Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2b2b2b; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #3c3f41; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 2px solid #555; }
        h1 { color: #55ff55; text-align: center; font-size: 24px; }
        .identity-box { background: #222; padding: 15px; border-radius: 5px; margin-bottom: 20px; border-left: 4px solid #55ff55; }
        .identity-box p { margin: 5px 0; font-size: 16px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #4b4d4f; margin: 8px 0; padding: 12px; border-radius: 5px; border-left: 4px solid #aaaaaa; }
        input[type="text"] { width: calc(100% - 24px); padding: 12px; margin-bottom: 15px; border: none; border-radius: 5px; background: #222; color: #fff; }
        button { width: 100%; padding: 12px; background: #55ff55; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #33cc33; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Loading Farm Data...</h1>
        
        <div class="identity-box">
            <p><strong>Farmer Name:</strong> <span id="owner">Loading...</span></p>
            <p><strong>NIM:</strong> <span id="nim">Loading...</span></p>
        </div>

        <h2>🎒 Backpack Inventory</h2>
        <ul id="itemList"></ul>

        <h3>➕ Craft / Find Item</h3>
        <input type="text" id="newItem" placeholder="Nama item (Misal: Starfruit)">
        <button onclick="addItem()">Add to Backpack</button>
    </div>

    <script>
        // PENTING: Saat deploy nanti, ubah 'localhost' menjadi FQDN atau IP Backend kamu!
        const API_URL = '/api';

        async function fetchInfo() {
            try {
                const response = await fetch(`${API_URL}/info`);
                const data = await response.json();
                
                document.getElementById('title').innerText = data.judul_katalog;
                document.getElementById('owner').innerText = data.pemilik;
                document.getElementById('nim').innerText = data.nim;

                const itemList = document.getElementById('itemList');
                itemList.innerHTML = '';
                data.items.forEach(item => {
                    const li = document.createElement('li');
                    li.innerText = item;
                    itemList.appendChild(li);
                });
            } catch (error) {
                console.error("Gagal terhubung ke Backend:", error);
            }
        }

        async function addItem() {
            const itemInput = document.getElementById('newItem');
            const itemValue = itemInput.value;
            
            if (!itemValue) {
                alert('Nama item tidak boleh kosong!');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/add-item`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ item: itemValue })
                });
                
                if (response.ok) {
                    itemInput.value = '';
                    fetchInfo(); // Refresh daftar item
                }
            } catch (error) {
                console.error("Gagal menambah item:", error);
            }
        }

        // Panggil fungsi saat halaman pertama kali dimuat
        fetchInfo();
    </script>
</body>
</html>
